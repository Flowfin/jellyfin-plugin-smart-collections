# Build the plugin against the oldest server SDK each line's manifest claims to
# load on (#11).
#
# A plugin compiled against a newer server SDK than the one it claims to support
# loads on the older server and throws at the first call to a member that server
# does not have. That failure arrives at runtime, in front of a user, and the
# shipping build does not catch it: it compiles against the newest SDK on the
# line, so every member added since the floor is available to it.
#
# The gap is real on the line this repository ships today. `InternalItemsQuery`,
# the type the rule vocabulary maps onto, gained a property inside the 10.11
# line:
#
#   props() {
#     gh api "repos/jellyfin/jellyfin/contents/MediaBrowser.Controller/Entities/InternalItemsQuery.cs?ref=$1" \
#       --jq .content | base64 -d | grep -oE '^\s+public [^=;{]+ \{ get' \
#       | sed -E 's/.*public //; s/ \{ get//' | sort
#   }
#   props v10.11.0 > f0; props v10.11.11 > f11; comm -13 f0 f11
#   bool? UseRawName
#
# Setting that property compiles against the shipping pin and does not exist on
# a server at the floor the manifest declares, so this job is the only route by
# which the mistake is refused before a release.
#
# The version each job builds against is written here rather than derived from
# the manifest, because a `targetAbi` is a four-part server version and a
# package version is not always the same string, which the 12.0 entry below is
# the live example of. The two are compared by eye when either moves, and the
# manifest each one belongs to is named on its line.
name: ABI floor

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny-all at the workflow level; the jobs below grant only what they read.
permissions: {}

# A superseded run on the same ref tells nobody anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    name: ABI floor (${{ matrix.line }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the tree to build it
    strategy:
      # One line failing says nothing about the other, and a reader wants both
      # verdicts rather than the first one.
      fail-fast: false
      matrix:
        include:
          # build.yaml declares targetAbi 10.11.0.0, and Jellyfin.Controller
          # 10.11.0 is published, so this job builds against the floor itself.
          - line: "10.11"
            framework: net9.0
            property: JellyfinSdkVersionNet9
            version: "10.11.0"
            manifest: build.yaml
            is-floor: "yes"
          # build-jf12.yaml declares targetAbi 12.0.0.0 and NO PACKAGE AT OR
          # ABOVE 12.0.0 IS PUBLISHED, so there is no floor for this entry to
          # build against and it names the version the shipping build pins
          # instead. While the two name the same string, which they do today,
          # this job PROVES NOTHING THE SHIPPING BUILD DOES NOT.
          #
          # The claim in front of that is the absence of a stable release, so the
          # command below reads for exactly that and returns nothing while the
          # claim holds. It stops reproducing on the day this entry has to move,
          # which is what an enumeration of the published candidates cannot do:
          #
          #   curl -s https://api.nuget.org/v3-flatcontainer/jellyfin.controller/index.json \
          #     | tr ',' '\n' | grep -o '"12\.[^"]*"' | tr -d '"' | grep -v -- '-'
          #   exit=1
          #
          # AN ENUMERATION STOOD HERE AND HAD STOPPED REPRODUCING. It listed the
          # candidates as far as rc5, rc6 is published, and the drift was found
          # by running the command that enumeration handed the reader.
          #
          # THE SHIPPING PIN IS NOT THE NEWEST CANDIDATE ON THE LINE, and this
          # comment once said it was. The pin is rc4, and rc4 and rc5 are not the
          # same surface:
          #
          #   props() {
          #     gh api "repos/jellyfin/jellyfin/contents/MediaBrowser.Controller/Entities/InternalItemsQuery.cs?ref=$1" \
          #       --jq .content | base64 -d | grep -oE '^\s+public [^=;{]+ \{ get' \
          #       | sed -E 's/.*public //; s/ \{ get//' | sort
          #   }
          #   props v12.0-rc4 > q4; props v12.0-rc5 > q5
          #   comm -13 q4 q5
          #   bool UserHasContentRestrictions
          #   comm -23 q4 q5 | wc -l
          #   0
          #
          # The candidate that arrived after that enumeration was written moves
          # neither direction of the same comparison, so it changes nothing in
          # the argument below:
          #
          #   props v12.0-rc6 > q6
          #   comm -13 q5 q6 | wc -l
          #   0
          #   comm -23 q5 q6 | wc -l
          #   0
          #
          # So this entry has two ways to stop adding nothing, not one. It bites
          # when 12.0.0 publishes and the version below moves to it, and it also
          # bites the day the shipping pin in the csproj moves ahead of the
          # version below, because a member added between the two is then
          # available to the shipping build and refused here. #11 carries the
          # build that was watched doing it, on the property named above.
          #
          # Of the two comparisons that matter when anything moves, one is made by
          # a run and one is made by eye. This version against the shipping pin
          # in the csproj is read on every run by the step below, which prints
          # both and annotates only while they name one string (#152). This
          # version against the targetAbi in the manifest is the one left to a
          # reader, because a targetAbi is a four-part server version and a
          # package version is not the same string, which is the reason the
          # versions here are written rather than read out of the manifest.
          #
          # It is here rather than absent so the day 12.0.0 publishes is a
          # one-line change instead of a job somebody has to remember to add.
          - line: "12.0"
            framework: net10.0
            property: JellyfinSdkVersionNet10
            version: "12.0.0-rc4"
            manifest: build-jf12.yaml
            is-floor: "no"
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here pushes, so the token has no reason to survive in
          # .git/config where every later step could read it.
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Both target frameworks are built by this workflow across its two
          # jobs, and the newer SDK builds the older target.
          dotnet-version: "10.0.x"

      # The shipping pin is read out of the project rather than copied here, so a
      # log says what the tree holds and not what somebody typed beside it. The
      # annotation below is the claim that this job adds nothing to the shipping
      # build, and that claim is exactly the two versions naming one string, so
      # it is derived from them rather than attached to the matrix entry (#152).
      - name: Say what this job is building against
        env:
          LINE: ${{ matrix.line }}
          MANIFEST: ${{ matrix.manifest }}
          FRAMEWORK: ${{ matrix.framework }}
          PROPERTY: ${{ matrix.property }}
          VERSION: ${{ matrix.version }}
          IS_FLOOR: ${{ matrix.is-floor }}
        run: |
          set -euo pipefail
          echo "Server line:      $LINE"
          echo "Manifest:         $MANIFEST"
          grep -n 'targetAbi' "$MANIFEST"
          echo "Building against: $VERSION"

          # -getProperty evaluates the project and prints one property. It is the
          # project's own answer rather than a pattern over the file, so a pin
          # that moves into a condition or an imported file is still read.
          project=Jellyfin.Plugin.SmartCollections/Jellyfin.Plugin.SmartCollections.csproj
          pinned=$(dotnet msbuild "$project" -getProperty:"$PROPERTY" -p:TargetFramework="$FRAMEWORK" | tr -d '[:space:]')
          echo "Shipping build pins: $pinned"

          if [ "$IS_FLOOR" != "yes" ]; then
            if [ "$pinned" = "$VERSION" ]; then
              echo "::warning::This line has no published package at the floor its manifest declares, so this job names $VERSION, which is the version the shipping build pins. While those are one string this job proves nothing the shipping build does not."
            else
              echo "This line has no published package at the floor its manifest declares, so this job names $VERSION rather than a floor. The shipping build pins $pinned, so the two are not one string and this build is over a different surface from the shipping one."
            fi
          fi

      - name: Build against that version
        env:
          FRAMEWORK: ${{ matrix.framework }}
          PROPERTY: ${{ matrix.property }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          dotnet build Jellyfin.Plugin.SmartCollections/Jellyfin.Plugin.SmartCollections.csproj \
            --configuration Release \
            --framework "$FRAMEWORK" \
            -p:"$PROPERTY=$VERSION"
