name: "🏗️ Build Plugin"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny-all at the workflow level; the job below grants only what the shared
# workflow reads.
permissions: {}

jobs:
  call:
    # Pinned to a commit rather than to a branch, so the workflow this
    # repository runs cannot change between two pushes without a change here
    # saying so. The trailing comment records the ref the pin was taken from and
    # is what Renovate reads to raise the update.
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master
    permissions:
      contents: read # check out the tree the package is built from
    with:
      # The project multi-targets net9.0 for the Jellyfin 10.11 line and net10.0 for the
      # 12.0 line. A restore covers every target framework, so an SDK for only one of them
      # cannot restore this tree at all, whichever framework the job goes on to build.
      dotnet-version: |
        9.0.x
        10.0.x
