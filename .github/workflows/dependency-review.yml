name: Dependency review

on:
  pull_request:

# Read-only: the dependency-review action only inspects the PR diff against the
# advisory database, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `name:` on this job. A ruleset requires a context by the literal check-run
  # name, which defaults to the job id ("dependency-review") when no `name:` is
  # set, so setting one here would replace that string rather than relabel it.
  # The `gate` ruleset does not require this context today, so nothing is broken
  # by the string moving; #13 is where requiring it is collected, and leaving the
  # id alone is what stops it being renamed twice. Which contexts are required is
  # a fact of the ruleset rather than of this file. Print it:
  #
  #   gh api repos/Flowfin/jellyfin-plugin-smart-collections/rulesets/20465770 \
  #     --jq '[.rules[] | select(.type=="required_status_checks")
  #           | .parameters.required_status_checks[].context]'
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed: any known vulnerability in a newly introduced or
          # upgraded dependency blocks the PR. Relax only with a documented
          # reason.
          fail-on-severity: low
