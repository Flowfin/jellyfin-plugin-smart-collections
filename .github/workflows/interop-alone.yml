# Boot a server per supported line with the packaged plugin and nothing else
# (#59).
#
# Every check in this repository so far reads source, or builds it, or packages
# it. None of them starts a server, so the sentence "this plugin loads" has
# never been anything but a claim. A package can install cleanly and fail at
# load time, and that failure arrives in front of a user with nothing in the
# gate having said a word.
#
# What this job installs is the ZIP THE PACKAGER PRODUCES, built here from the
# same action and the same pin the shipping package check uses. Copying build
# output into the container would prove the code works and not that the thing
# users download works, and the issue this job comes from names that difference
# as the whole failure in more than one plugin release.
#
# The harness is a first-party script in the tree, for the reason the coverage
# floor and the hygiene check are: the gate should be readable here and should
# not depend on a third party holding write access. It runs the same way on a
# workstation with a container runtime as it does here, which is the fourth part
# of the issue's done condition:
#
#   node .github/scripts/boot-a-line-with-only-this-plugin.js \
#     --image jellyfin/jellyfin:10.11.11 --package <package.zip>
#
# Two probes run ahead of the run that matters, which is the ordering the
# package check and the invariant lint already use. A harness that asserted
# nothing would pass the real run exactly like one that is holding.
#
#   The log scan is fed a fabricated error line naming this plugin, which it
#   must refuse, and one naming something else, which it must pass. No container.
#
#   The harness is pointed at the same image with NO PLUGIN INSTALLED, and must
#   refuse. That proves the assertion that the plugin is loaded and active, and
#   it proves neither of the other two: the script's own header says which arm
#   is watched passing and has never been watched failing.
#
# The two lines are separate jobs rather than one, for the reason the ABI floor
# workflow gives: one line failing says nothing about the other, and a reader
# wants both verdicts rather than the first one.
#
# It needs no display, no elevated rights and no machine trust store. The server
# answers plain HTTP on a loopback port inside the runner, so nothing here
# trusts a certificate.
#
# Whether these job names are in the branch ruleset's required set is a fact of
# the ruleset rather than of this file (#20). Print it:
#
#   gh api repos/Flowfin/jellyfin-plugin-smart-collections/rulesets/20465770 \
#     --jq '[.rules[] | select(.type=="required_status_checks")
#           | .parameters.required_status_checks[].context]'
name: Interoperability

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny-all at the workflow level; the job below grants only what it reads.
permissions: {}

# A superseded run on the same ref tells nobody anything, and this one holds a
# container runtime for the length of four server boots.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alone:
    # The check run takes this name, and that is the string #20 would put in the
    # required list. Renaming it renames the required context.
    name: Alone (${{ matrix.line }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read # check out the tree the package is built from
    strategy:
      fail-fast: false
      matrix:
        include:
          # build.yaml declares targetAbi 10.11.0.0 and 10.11.11 is the newest
          # image published on that line, so this job boots a server the
          # manifest claims to load on.
          - line: "10.11"
            framework: net9.0
            manifest: build.yaml
            image: "jellyfin/jellyfin:10.11.11"
            is-released: "yes"
          # build-jf12.yaml declares targetAbi 12.0.0.0 and NO RELEASED 12.0
          # IMAGE EXISTS. The newest tag on that line is a release candidate:
          #
          #   curl -s "https://hub.docker.com/v2/repositories/jellyfin/jellyfin/tags?page_size=100&ordering=last_updated" \
          #     | tr ',' '\n' | grep -o '"name":"12[^"]*"'
          #
          # so this job boots the candidate and says so on every run rather than
          # reporting a line it did not test. It is here rather than absent for
          # the reason the ABI floor's 12.0 job is: the day 12.0.0 publishes is
          # then a one-line change instead of a job somebody has to remember.
          - line: "12.0"
            framework: net10.0
            manifest: build-jf12.yaml
            image: "jellyfin/jellyfin:12.0-rc4"
            is-released: "no"
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here pushes, so the token has no reason to survive in
          # .git/config where every later step could read it.
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Both, whichever framework this job packs. A restore is a
          # cross-targeting operation and resolves every target framework the
          # projects declare, so an SDK for only one of them cannot restore this
          # tree at all.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Say what this job is booting
        env:
          LINE: ${{ matrix.line }}
          MANIFEST: ${{ matrix.manifest }}
          IMAGE: ${{ matrix.image }}
          IS_RELEASED: ${{ matrix.is-released }}
        run: |
          set -euo pipefail
          echo "Server line: $LINE"
          echo "Manifest:    $MANIFEST"
          grep -n 'targetAbi' "$MANIFEST"
          echo "Image:       $IMAGE"
          if [ "$IS_RELEASED" != "yes" ]; then
            echo "::warning::This line has no released image at the floor its manifest declares, so this job boots a release candidate and what it reports is a verdict about that candidate rather than about a released server."
          fi

      - name: Put this line's manifest where the packager reads it
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          if [ "$MANIFEST" != "build.yaml" ]; then
            cp "$MANIFEST" build.yaml
          fi
          grep -n 'targetAbi\|framework' build.yaml

      - name: Build the package this job installs
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        id: jprm
        with:
          dotnet-target: ${{ matrix.framework }}

      - name: Prove the log scan refuses an error from this plugin
        run: node .github/scripts/boot-a-line-with-only-this-plugin.js --prove-the-log-scan-bites

      - name: Prove the harness refuses a server with no plugin installed
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          if node .github/scripts/boot-a-line-with-only-this-plugin.js \
            --image "$IMAGE" --port 18097 --without-the-plugin; then
            echo "::error::The harness passed a server with no plugin installed, so the run below proves nothing about whether the package loaded."
            exit 1
          fi
          echo "The harness refuses a server with no plugin installed."

      - name: Boot the line with only this plugin
        env:
          IMAGE: ${{ matrix.image }}
          ARTIFACT: ${{ steps.jprm.outputs.artifact }}
        run: |
          set -euo pipefail
          node .github/scripts/boot-a-line-with-only-this-plugin.js \
            --image "$IMAGE" --package "$ARTIFACT"
