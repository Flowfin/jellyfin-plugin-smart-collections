# Measure what the suite would catch if determinism broke, and hold it at the
# set of faults the suite actually notices (#46, and #200 for what "hold" means
# here now).
#
# Line coverage does not measure this. A test that executes a line without
# asserting anything about it covers the line and catches nothing, so the
# coverage floor this repository already runs answers "was this code executed"
# and never "would a change to it be noticed". Mutation testing answers the
# second question directly: the tool changes one operator, boundary or return
# value at a time and reports which changes the suite failed to notice. A
# surviving mutant is a statement about the suite rather than about the code,
# and each one is either a missing test or a piece of code nobody needed.
#
# The run is scoped to the engine assembly, where the determinism claim lives.
# The configuration page and the plugin host are covered by their own tests and
# are not where a determinism failure would hide. `stryker-config.json` names
# the project rather than a glob, so a file added to the engine is mutated
# without anybody remembering to widen a list.
#
# By construction this job runs on no pull request. A full run is half an hour of
# compute that says the same thing as the run before it unless the engine or the
# suite moved, and the pull request gate already has enough legs. It runs on a
# schedule and on manual dispatch and never on a merge path, which is also why
# its name cannot become a required status check by accident. THAT COST WENT UP
# WITH #200 rather than staying where this paragraph found it, and the
# concurrency paragraph below is where the reason is.
#
# WHAT THIS JOB HOLDS IS A SET AND NOT A SCORE, AND THIS PARAGRAPH ARGUED THE
# OPPOSITE UNTIL #200. It said the threshold was the measured score and that a
# deleted assertion would red the run, and both halves rested on the score being
# a fact about the tree. It is a fact about a RUN: three consecutive runs on an
# unchanged tree, measured on 2026-09-02 and recorded on #200, landed 91.31,
# 91.44 and 91.31, and the two that agreed to the hundredth disagreed about which
# mutants survived. So the tool's own break is
# off - `thresholds.break` is 0 in `stryker-config.json`, which reports the score
# and enforces nothing - and `mutation-record.json` carries the surviving set,
# the mutants whose verdict moves, and the killed count over what is left.
# `.github/scripts/mutation-record.js` compares a run against it in both
# directions, the way `.github/scripts/coverage-floor.js` does for the floor
# beside it, and #200 carries the measurements.
#
# THE CONCURRENCY IS PART OF THE MEASUREMENT. Nine runs in three arrangements
# said that test classes executing in parallel during the coverage capture are
# what moves the survivor set: in sequence, no mutant moved between survived and
# killed on any of three runs. So the tool is run at concurrency one here, the
# record declares the same number, and the check refuses the two disagreeing. It
# costs wall clock, which is what the timeout below is sized for.
#
# A run that produced no report fails here. `if-no-files-found: error` on the
# upload is what stops a tool or infrastructure failure ending green with
# nothing measured, which reads exactly like a run that measured everything and
# found nothing wrong.
#
# The tool is pinned in the committed manifest and restored rather than
# installed by name, so the version that produced the record is the version a
# later run uses:
#
#   cat .config/dotnet-tools.json
name: Mutation

on:
  schedule:
    # Weekly, on the same day as the other scheduled work and at a minute of its
    # own so two scheduled runs do not contend for a runner:
    #
    #   grep -rn 'cron:' .github/workflows/
    - cron: "13 5 * * 1"
  workflow_dispatch:

# Deny-all at the workflow level; the job below grants only what it reads.
permissions: {}

# A superseded run on the same ref tells nobody anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    # THIS WAS 30 AND THE RUN GOT LONGER ON PURPOSE. At the tool's default
    # concurrency a pass was minutes; at concurrency one it is a single test
    # session per mutant. Measured here rather than guessed at, on the dispatched
    # run that the record was written from:
    #
    #   gh api repos/Flowfin/jellyfin-plugin-smart-collections/actions/runs/33980381830/jobs --jq
    #     '.jobs[0].steps[] | select(.name=="Measure the mutation score")
    #      | .started_at + " -> " + .completed_at'
    #   2026-09-05T17:15:36Z -> 2026-09-05T17:30:30Z
    #
    # Fifteen minutes for the tool on this runner, against just under half an
    # hour for the same pass on a 32-processor Windows clone - the runner is
    # FASTER here, which is the opposite of what the reading this replaces
    # assumed. The limit stays well above both because the class of mutant that
    # decides the tail is the static one, which runs against the whole suite, and
    # one slow session is what a hung run looks like. A genuinely hung run is
    # still cut off.
    timeout-minutes: 120
    permissions:
      contents: read # check out the tree that is mutated and tested
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here pushes, so the token has no reason to survive in
          # .git/config where every later step could read it.
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The run mutates the net10.0 build, and a restore resolves every
          # target framework whatever the build asks for, so both SDKs have to
          # be here.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore the projects
        run: dotnet restore --locked-mode

      - name: Restore the pinned tool
        # By manifest rather than by name, so this is the version the record was
        # measured with and not whatever is newest on the day.
        run: dotnet tool restore

      - name: Prove the record check bites
        # Before the tool runs, so a check that has stopped refusing is reported
        # in seconds rather than after a run of this length, and so a green
        # comparison below is one that could have been red. Every arm of the
        # comparison is exercised against a fabricated run and record pair built
        # to trip exactly it and against a one-change neighbour that trips
        # nothing.
        run: node .github/scripts/mutation-record.js --prove-the-check-bites

      - name: Measure the mutation score
        # `--concurrency 1` is the arrangement the record was taken under and is
        # not a speed setting; see the paragraph on it above. It is on the
        # command line rather than in the configuration because the tool takes no
        # such key in a config file, and the check refuses this line and the
        # record disagreeing, so the two cannot drift.
        #
        # Nothing here passes a threshold: `thresholds.break` is 0 in
        # stryker-config.json, so this step reports the score and refuses
        # nothing, and the step below is what makes a weakened suite red.
        run: dotnet stryker --concurrency 1

      - name: Upload the mutation report
        # Uploaded whatever the step above decided, because the run somebody
        # wants to read is the red one: the report names each surviving mutant,
        # its file and its line, which is the list of tests worth writing.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: StrykerOutput/**/reports/**
          retention-days: 14
          if-no-files-found: error

      - name: Compare the run against the record
        # After the upload, so the report is downloadable from a run this step
        # reds. This is the only step that refuses anything about the suite now:
        # the tool's break is 0, so a red here is a survivor the record does not
        # name, a record survivor this run killed, a record entry no mutant
        # matches, a killed count off the floor in either direction, or a
        # workflow and a record that disagree about the concurrency.
        #
        # THIS STEP USED TO JUDGE `docs/mutation-score.md` AND NO LONGER DOES,
        # and that is a guard removed rather than replaced. #192 built it because
        # the page carried the score, the status counts and the
        # killed-over-scored figure, and a change that raised the threshold
        # correctly and left the page alone passed every route here. The page
        # carries no figure now - it hands the reader the command that derives
        # each one from the record - so there is nothing left to re-extract. A
        # figure typed into that page tomorrow is refused by nothing, and the
        # page says so about itself.
        run: node .github/scripts/mutation-record.js StrykerOutput
