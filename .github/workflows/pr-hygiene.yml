# Deterministic pull-request hygiene checks (#15). Every other check in this
# repository reasons about the code: the build compiles it, the test suite
# asserts on it, CodeQL scans it, the unicode guard reads its bytes. Whether the
# change is linked to an issue, whether a version bump brought its changelog
# entry, whether it is large enough to need a closer look, and whether engine
# code moved without its tests are properties of the pull request rather than of
# the code, and nothing here covered that class.
#
# The means is a workflow plus one first-party script step, not a hosted review
# bot: the merge gate should be readable in this tree and should not depend on a
# third-party service holding write access to it.
#
# The checks are tiered by confidence, so the gate does not red a reasonable
# pull request:
#
#   FAIL, high confidence, near-zero false positive:
#     - the body carries an issue reference
#     - a build.yaml version bump also touches CHANGELOG.md
#     - no negated closing keyword sits next to an issue reference (#182)
#
#   WARN, annotation only, never fails:
#     - the diff is large
#     - plugin code changed with no matching change under the test project
#
# Whether this job's name is in the branch ruleset's required set is a fact of
# the ruleset, not of this file, and restating it here is how a header goes
# stale. Print it:
#
#   gh api repos/Flowfin/jellyfin-plugin-smart-collections/rulesets/20465770 \
#     --jq '[.rules[] | select(.type=="required_status_checks")
#           | .parameters.required_status_checks[].context]'
name: PR Hygiene

on:
  pull_request:
    # edited: so editing the body to add the issue reference re-runs the check
    # rather than leaving a red that the fix cannot clear.
    types: [opened, edited, synchronize, reopened]

# Deny-all at the workflow level; the job below grants only what it reads.
permissions: {}

# Cancel a superseded run on the same pull request. This is a lint, not a
# publish, so an obsolete run is safe to drop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Deterministic pull request hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the build.yaml patch through the pulls API
      pull-requests: read # read the body, the changed-file list and the commit messages
    steps:
      # No checkout. Every input comes from the pull request metadata and the
      # changed-file patches, so there is no working tree here to guard. The
      # untrusted values - the body, the file names - are read from API objects
      # and never interpolated into a shell `run:`, so there is no template
      # injection surface.
      - name: Run the hygiene checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const failures = [];
            const warnings = [];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changed = files.map((f) => f.filename);
            const isBot = pr.user && pr.user.type === "Bot";

            // The commit messages, for FAIL 3 below. They are fetched here
            // rather than there because this is where the pull request's
            // contents are read, and because the arm that uses them has to see
            // every commit rather than the head: a keyword in the third of five
            // messages closes an issue exactly as one in the last does.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            // Who the FAIL tier is for: every author but a bot.
            //
            // THIS WAS NARROWED BY AUDIENCE UNTIL #246 AND THE NARROWING MADE
            // THE TIER UNREACHABLE. It read the author's relationship to this
            // repository out of the event payload and skipped the tier for
            // anything outside ["OWNER", "MEMBER"]. The payload answers
            // COLLABORATOR on the pull requests this repository actually
            // receives, so the tier was skipped on all of them, while the same
            // field read back through the pulls API answers MEMBER. #246
            // carries the four runs that were measured and the disagreement
            // between the two routes.
            //
            // What that cost is the whole point of the repair rather than a
            // detail of it: this job's name is in the branch ruleset's required
            // set, so a context that cannot fail was standing in front of every
            // merge and refusing nothing. A gate is worth what it refuses, and
            // an audience test keyed on a field that answers differently on two
            // routes is not a thing a merge should rest on.
            //
            // A bot is still skipped, and for a reason no reading of a payload
            // can move: it cannot know the convention at all, and a machine
            // account opening a dependency bump has no issue to name. That is
            // the one exemption left and it is keyed on the account being a
            // bot, which is a fact about the account rather than about its
            // relationship to this repository.
            //
            // An author from outside this repository is now held to the same
            // tier as one from inside. The argument the narrowing rested on -
            // that somebody arriving from outside cannot know which issue
            // number to carry - is answered by the refusal text itself, which
            // says what to write, rather than by not running the test. Should
            // this repository ever take an outside contribution and find the
            // refusal unreasonable there, that is a decision to re-take on
            // #246 with the run in front of it, not a skip to restore quietly.
            //
            // The association is annotated rather than acted on, so the value
            // the payload carries stays readable on the run without deciding
            // anything.
            const failTierApplies = !isBot;
            if (!isBot) {
              warnings.push(
                "The failing tier applies to this author (author_association: " +
                  `${pr.author_association || "NONE"}). It is applied whatever ` +
                  "that value is, since #246: reading it decided nothing but " +
                  "whether the tier ran, and it answered differently on the " +
                  "two routes that read it.",
              );
            }

            // FAIL 1: the body references an issue.
            //
            // A bare `#12`, a keyword form such as `Closes #12`, and a full
            // issue URL all satisfy it. Lenient on purpose: a pull request that
            // is genuinely linked should never be flagged over phrasing.
            //
            // Code is removed before the test, because a quotation is not a
            // link. The refusal below names two example issue numbers, so a
            // body that records the refusal by pasting it carries them, and a
            // test reading the body whole cannot tell that paste from a
            // reference. One body in this repository passed on exactly that,
            // and it was the pull request opened to prove this check refuses a
            // body with no reference.
            //
            // Fenced blocks and inline spans only. An indented block is left
            // alone because ordinary wrapped prose is indented here too, and
            // removing it would take a genuine reference out of the text.
            const withoutCode = (text) =>
              text
                .replace(/```[\s\S]*?```/g, " ")
                .replace(/~~~[\s\S]*?~~~/g, " ")
                .replace(/`[^`\n]*`/g, " ");
            const namesAnIssue = (text) =>
              /(^|[^\w])#\d+\b/.test(text) ||
              /github\.com\/[^\/\s]+\/[^\/\s]+\/issues\/\d+/i.test(text);

            // The fixtures this test is held to, checked before the pull
            // request is judged, in the shape the invariant lint already uses:
            // every rule fires on its own fixture and passes its near miss, or
            // nothing is scanned at all. They matter more here than there,
            // because the tier this test lives in is skipped for an author the
            // payload reads as outside this repository, so a run where it is
            // skipped exercises the test nowhere else. Removing the three
            // replacements above reds three of the seven.
            const FIXTURES = [
              ["Closes #12", true],
              ["See https://github.com/o/r/issues/12 for the report.", true],
              ["A number in prose, #12, and a fence after it\n\n```\nnothing here\n```", true],
              ["```\nThe body carries no issue reference. Name the issue this change addresses, for example `Closes #12` or `Refs #12`.\n```", false],
              ["Refused with `Closes #12` in a code span and named nowhere else.", false],
              ["```\nhttps://github.com/o/r/issues/12\n```", false],
              ["No number here at all.", false],
            ];
            const disagreeing = FIXTURES.filter(
              ([text, wanted]) => namesAnIssue(withoutCode(text)) !== wanted,
            );
            if (disagreeing.length) {
              core.setFailed(
                `The issue-reference test disagrees with ${disagreeing.length} ` +
                  `of its ${FIXTURES.length} fixtures, so it is not judging ` +
                  "this pull request. Repair the test rather than the fixtures.",
              );
              return;
            }

            const body = pr.body || "";
            const hasIssueRef = namesAnIssue(withoutCode(body));

            if (failTierApplies && !hasIssueRef) {
              failures.push(
                "The body carries no issue reference. Name the issue this " +
                  "change addresses, for example `Closes #12` or `Refs #12`.",
              );
            }

            // FAIL 2: a build.yaml version bump brings its changelog entry.
            //
            // The version line only moves in a release change, which owes a
            // changelog entry. A change that is not a release never edits it,
            // so this stays silent for every other pull request.
            const manifest = files.find((f) => f.filename === "build.yaml");
            const versionBumped =
              manifest && manifest.patch && /^\+\s*version:/m.test(manifest.patch);
            if (failTierApplies && versionBumped && !changed.includes("CHANGELOG.md")) {
              failures.push(
                "build.yaml `version:` changed and CHANGELOG.md did not. " +
                  "Record the release in CHANGELOG.md.",
              );
            }

            // FAIL 3: a closing keyword under a negation, next to a reference.
            //
            // GitHub closes an issue when a merged pull request's body or any
            // of its commit messages carries a closing keyword directly in
            // front of a reference. It reads the pair and not the sentence
            // around it, so a change explaining that it does NOT finish an
            // issue finishes it. Three issues on this tracker were shut that
            // way and reopened, and the third came from a commit message, which
            // cannot be edited afterwards the way a body can. #182 carries the
            // three with the commands that read them.
            //
            // The subject is narrow on purpose. A plain `Closes #12` is the
            // intended channel and is untouched; what is refused is a keyword
            // with a negator immediately in front of it, which nobody writes
            // meaning to close anything. That is why this arm can fail rather
            // than warn.
            //
            // It applies whoever wrote the pull request, unlike FAIL 1. That
            // check enforces a convention of this repository, which somebody
            // arriving from outside cannot be expected to know. This one is not
            // a convention: the tracker ends up wrong by the same amount
            // whoever typed the sentence, and the repair is the same one line.
            //
            // Code is removed first, for the reason FAIL 1 removes it: a body
            // quoting the refused sentence as evidence is recording the rule,
            // not breaking it, and the pull request that lands this check is
            // the first body that has to do so.
            const NEGATED_CLOSER =
              /(?:\b(?:no longer|never|cannot|can[''’]t|won[''’]t|doesn[''’]t|don[''’]t|didn[''’]t|isn[''’]t|aren[''’]t|wouldn[''’]t|shouldn[''’]t)|\bnot)\s+(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:issue\s+)?(?:#\d+|https?:\/\/\S*\/issues\/\d+)/i;
            const negatesACloser = (text) => NEGATED_CLOSER.test(withoutCode(text));

            // Held to fixtures before it judges anything, in the shape FAIL 1
            // uses. The near misses are the half that matters: a plain closing
            // keyword is the intended channel, a negation with no reference
            // beside it closes nothing, and a body quoting the refused sentence
            // as evidence is recording the rule rather than breaking it, so
            // firing on any of the three would make this arm a tax on ordinary
            // prose.
            //
            // The quotation fixture uses a code SPAN rather than a fence, and
            // deliberately. A body pasting this fixture list as its evidence
            // would otherwise carry a fence inside its own fence, and the strip
            // pairs the first closing marker it meets - so the body arguing for
            // this arm would be refused by it. The span exercises the same
            // branch of the strip and survives being quoted.
            const CLOSER_FIXTURES = [
              ["This does not close #29.", true],
              ["This doesn\u2019t close #29 yet.", true],
              ["It will not fix #29.", true],
              ["This no longer resolves #29.", true],
              ["It does not close https://github.com/o/r/issues/29.", true],
              ["Closes #29", false],
              ["Fixes #29, and the suite is green.", false],
              ["Refs #29. This does not close it.", false],
              ["Recorded as `This does not close #29.` and nothing else.", false],
              ["Nothing about issues here.", false],
            ];
            const closerDisagreeing = CLOSER_FIXTURES.filter(
              ([text, wanted]) => negatesACloser(text) !== wanted,
            );
            if (closerDisagreeing.length) {
              core.setFailed(
                `The negated-closing-keyword test disagrees with ${closerDisagreeing.length} ` +
                  `of its ${CLOSER_FIXTURES.length} fixtures, so it is not judging ` +
                  "this pull request. Repair the test rather than the fixtures.",
              );
              return;
            }

            const REPAIR =
              "GitHub reads the keyword next to the reference and not the " +
              "sentence around it, so this closes the issue on merge. Write " +
              "the reference without a closing keyword beside it: `#29 stays " +
              "open` or `leaves #29 open` says the same thing and survives the " +
              "parser.";

            if (negatesACloser(body)) {
              failures.push("The body negates a closing keyword. " + REPAIR);
            }

            const offendingCommits = commits
              .filter((c) => negatesACloser((c.commit && c.commit.message) || ""))
              .map((c) => c.sha.slice(0, 7));
            if (offendingCommits.length) {
              failures.push(
                `A commit message negates a closing keyword (${offendingCommits.join(", ")}). ` +
                  REPAIR +
                  " A body can be edited after the merge and a landed message cannot, " +
                  "so this one is repaired before the branch lands rather than after.",
              );
            }

            // WARN 1: the diff is large.
            //
            // Review quality falls off on a large diff, so a large one is worth
            // a closer look. Large is not wrong, though: a bulk rename, a
            // documentation import or a first landing legitimately exceeds any
            // cap, and hard-failing those is the false positive this tier
            // exists to avoid. Generated and lock files are excluded so the
            // number reflects what a person wrote.
            const isGenerated = (name) =>
              name.endsWith("packages.lock.json") ||
              name.endsWith(".min.js") ||
              name.endsWith(".min.css");
            const churn = files
              .filter((f) => !isGenerated(f.filename))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const WARN_AT = 400;
            if (churn >= WARN_AT) {
              warnings.push(
                `This pull request changes ${churn} lines, excluding generated ` +
                  `and lock files. Past about ${WARN_AT} lines a review starts ` +
                  "missing things, so this one wants a closer read.",
              );
            }

            // WARN 2: plugin code moved without the test project moving.
            //
            // The project directories are matched by shape rather than by their
            // current names, because renaming the template artefacts is open
            // work and a hard-coded directory name would silently stop matching
            // the day it lands.
            const isTestPath = (name) => /^[^\/]+\.Tests\//.test(name);
            const codeChanged = changed.some(
              (n) => n.endsWith(".cs") && !isTestPath(n),
            );
            const testsChanged = changed.some(isTestPath);
            if (codeChanged && !testsChanged) {
              warnings.push(
                "Plugin code changed and nothing under the test project did. " +
                  "Either the change is genuinely untestable, a refactor or a " +
                  "comment, or it wants a test.",
              );
            }

            for (const w of warnings) {
              core.warning(w);
            }

            const summary = core.summary.addHeading("Pull request hygiene", 2);
            if (failures.length === 0 && warnings.length === 0) {
              summary.addRaw("Every hygiene check passed.");
            } else {
              if (failures.length) {
                summary.addHeading("Failures", 3).addList(failures);
              }
              if (warnings.length) {
                summary.addHeading("Warnings, which do not fail this check", 3).addList(warnings);
              }
            }
            await summary.write();

            if (failures.length) {
              core.setFailed(failures.join(" | "));
            }
