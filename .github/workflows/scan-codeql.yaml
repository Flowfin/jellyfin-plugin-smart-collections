name: "🔬 Run CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "24 2 * * 4"
  workflow_dispatch:

# Deny-all at the workflow level; the job below grants only what the shared
# workflow reads.
permissions: {}

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master
    permissions:
      security-events: write # upload the CodeQL results into the code-scanning tab
      contents: read # check out the tree to analyse
      actions: read # read the workflow run the results are attributed to
    with:
      # The shared workflow guards its only job on `github.repository ==
      # inputs.repository-name`, so this string decides whether anything is
      # scanned. A stale one does not fail: the job reports as skipped, the
      # scan silently stops happening, and the check run loses the language
      # suffix its matrix would have added, which moves the context name a
      # ruleset would have to match. Move this line whenever the repository
      # moves.
      repository-name: Flowfin/jellyfin-plugin-smart-collections
