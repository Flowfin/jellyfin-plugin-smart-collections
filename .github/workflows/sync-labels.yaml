name: '🏷️ Sync labels'

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

# Deny-all at the workflow level; the job below grants only what the shared
# workflow reads.
permissions: {}

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/sync-labels.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master
    permissions:
      issues: write # labels are written through the issues API
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
