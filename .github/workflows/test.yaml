name: "🧪 Test Plugin"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny-all at the workflow level; the job below grants only what the shared
# workflow reads.
permissions: {}

jobs:
  call:
    # This job id is half of a check context. A called workflow prefixes the
    # runs it produces with the id of the job that calls it, so the run from
    # here is named `call / <the job in the called workflow>`, and the branch
    # ruleset requires `call / test`. Changing this id removes that context
    # rather than renaming one, so it is changed only together with whatever
    # requires it.
    #
    # The other half of the string is decided in another repository. The called
    # workflow declares its job as `test` and gives it no `name:`, so the run
    # falls back to that id:
    #
    #   gh api "repos/jellyfin/jellyfin-meta-plugins/contents/.github/workflows/test.yaml?ref=eb99033a7ff644881b014bc0b4169916c854a68b" \
    #     --jq .content | base64 -d | sed -n '10,12p'
    #   jobs:
    #     test:
    #       runs-on: ubuntu-latest
    #
    # So a bump of the pin below can carry away a required context, and no
    # reading of this file would show it.
    #
    # Which contexts the ruleset requires is a fact of the ruleset rather than
    # of this file (#13, #20). Print it:
    #
    #   gh api repos/Flowfin/jellyfin-plugin-smart-collections/rulesets/20465770 \
    #     --jq '[.rules[] | select(.type=="required_status_checks")
    #           | .parameters.required_status_checks[].context]'
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/test.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master
    permissions:
      contents: read # check out the tree the suite runs against
    with:
      # The project multi-targets net9.0 for the Jellyfin 10.11 line and net10.0 for the
      # 12.0 line. A restore covers every target framework, so an SDK for only one of them
      # cannot restore this tree at all, whichever framework the job goes on to build.
      dotnet-version: |
        9.0.x
        10.0.x
