---
# The Jellyfin 12.0 line's manifest. Everything outside targetAbi and framework is word for word
# what build.yaml says, and a test refuses a divergence: the two packages are one plugin, so a
# server that upgrades across the line boundary has to see an update rather than a second entry.
name: "Smart Collections"
guid: "70dd8311-1053-4eb7-8406-8df766b2d040"
imageUrl: "https://raw.githubusercontent.com/Flowfin/jellyfin-plugin-smart-collections/master/img/logo.png"
version: "1.0.0.0"
# Jellyfin 12.0 moves the server to .NET 10, so a package carrying the 10.11 ABI does not load
# there. This is the 12.0 line's floor.
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Collections filled from a rule over library metadata. Under development, and installing it does nothing yet."
description: >
  A Jellyfin collection is normally a list an administrator keeps by hand. This is being built so a collection is described once as a rule over library metadata, and then holds whatever matches the rule as the library changes.

  It is not built yet. Installing it today does nothing.
category: "General"
owner: "Flowfin"
artifacts:
  - "Jellyfin.Plugin.SmartCollections.Engine.dll"
  - "Jellyfin.Plugin.SmartCollections.dll"
changelog: >
  changelog
